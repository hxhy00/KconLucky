services:
  gift:
    image: kcon/gift:1.0
    container_name: kcon-gift
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # 对外访问地址（含端口），决定邮件/页面里的链接
      KCON_SITE_URL: ${KCON_GIFT_SITE_URL:?请设置 KCON_GIFT_SITE_URL，如 http://123.57.9.62:8848}
      KCON_DB_PATH: /app/data/kcon.db
      # 初始管理员（admin 表为空时写入）：email 或 email:姓名，逗号分隔，≤3
      KCON_ADMIN_EMAILS: ${KCON_ADMIN_EMAILS:?请设置 KCON_ADMIN_EMAILS}
      KCON_SYSTEM_EMAIL: ${KCON_SYSTEM_EMAIL:-kcon@knownsec.com}
      # 生产必须为 0：禁止把验证码回显给请求方
      KCON_DEMO_CODE: "0"
      # 二期真实发信：设置 KCON_SMTP_HOST 后自动切换到 SMTP
      KCON_SMTP_HOST: ${KCON_SMTP_HOST:-}
      KCON_SMTP_PORT: ${KCON_SMTP_PORT:-465}
      KCON_SMTP_USER: ${KCON_SMTP_USER:-}
      KCON_SMTP_PASSWORD: ${KCON_SMTP_PASSWORD:-}
    ports:
      - "8848:8848"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
