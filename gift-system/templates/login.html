<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · KCon2026 赠票系统</title>
  <script>window.KCON_BASE = "{{base}}";</script>
  <link rel="stylesheet" href="{{base}}/static/css/style.css">
</head>

<body class="console">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="t">KCon</div>
        <div class="s"><b>奕智</b> · KCon2026 赠票管理系统</div>
      </div>
      <div id="alert" class="alert"></div>
      <div class="field">
        <label>邮箱地址</label>
        <input id="email" class="input" type="email" placeholder="请输入邮箱" autocomplete="username">
        <div class="hint">管理员邮箱由运维配置</div>
      </div>
      <div class="field">
        <label>验证码</label>
        <div class="flex gap-8">
          <input id="code" class="input flex-1" type="text" placeholder="6 位数字" maxlength="6" inputmode="numeric">
          <button id="sendBtn" class="btn ghost" style="white-space:nowrap;">获取验证码</button>
        </div>
      </div>
      <button id="loginBtn" class="btn block mt-8">登 录</button>
      <div class="center mt-16 small dim">
        <a href="{{base}}/mailbox">📬 查看邮件出箱（Demo）</a>
      </div>
    </div>
  </div>
  <script src="{{base}}/static/js/common.js"></script>
  <script>
    let countdown = 0, timer = null;
    function showAlert(msg, type) {
      const a = $('#alert');
      a.className = 'alert show ' + (type || 'err');
      a.textContent = msg;
    }
    $('#sendBtn').onclick = async () => {
      const email = $('#email').value.trim();
      if (!email) return showAlert('请输入邮箱');
      const r = await API.post('/api/auth/send-code', { email });
      if (!r.ok) return showAlert(r.msg);
      showAlert(r.msg + (r.demo_code ? `（Demo 验证码：${r.demo_code}）` : ''), 'ok');
      countdown = 60;
      $('#sendBtn').disabled = true;
      timer = setInterval(() => {
        countdown--;
        $('#sendBtn').textContent = countdown > 0 ? `${countdown}s` : '获取验证码';
        if (countdown <= 0) { clearInterval(timer); $('#sendBtn').disabled = false; }
      }, 1000);
    };
    $('#loginBtn').onclick = async () => {
      const email = $('#email').value.trim();
      const code = $('#code').value.trim();
      if (!email || !code) return showAlert('请填写邮箱和验证码');
      const r = await API.post('/api/auth/login', { email, code });
      if (!r.ok) return showAlert(r.msg);
      API.setSid(r.sid);
      location.href = KCON_BASE + (r.role === 'admin' ? '/gift-admin' : '/gift-approver');
    };
    $('#code').onkeydown = e => { if (e.key === 'Enter') $('#loginBtn').click(); };
  </script>
</body>

</html>
