<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>申请成为推荐人 · KCon2026</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" style="max-width:480px;">
    <div class="brand">
      <div class="t">KCon</div>
      <div class="s"><b>奕智</b> · 申请成为赠票推荐人</div>
    </div>
    <div id="alert" class="alert"></div>
    <div id="formArea">
      <div class="field"><label>姓名<span class="req">*</span></label><input id="f_name" class="input" placeholder="请输入真实姓名"></div>
      <div class="field"><label>公司<span class="req">*</span></label><input id="f_company" class="input" placeholder="请输入公司名称"></div>
      <div class="field"><label>部门<span class="req">*</span></label><input id="f_dept" class="input" placeholder="请输入部门"></div>
      <div class="field"><label>手机号<span class="req">*</span></label><input id="f_mobile" class="input" placeholder="11 位手机号" maxlength="11"></div>
      <div class="field"><label>邮箱<span class="req">*</span></label><input id="f_email" class="input" type="email" placeholder="用于接收审批结果与专属链接"></div>
      <button id="submitBtn" class="btn block">提交申请</button>
      <div class="hint center mt-16">提交后需渠道审批员审批，结果将发送至您的邮箱</div>
    </div>
    <div id="doneArea" class="hidden center">
      <div style="font-size:52px;margin-bottom:16px;">✅</div>
      <div class="bold" style="font-size:16px;">申请已提交</div>
      <p class="muted small mt-8">请等待渠道审批员审批，审批结果将发送至您的邮箱。</p>
    </div>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script>
const CHANNEL_CODE = location.pathname.split('/r/')[1] || '';
function show(msg, type) {
  const a = $('#alert'); a.className = 'alert show ' + (type || 'err'); a.textContent = msg;
}
$('#submitBtn').onclick = async () => {
  const d = {
    channel_code: CHANNEL_CODE,
    name: $('#f_name').value.trim(),
    company: $('#f_company').value.trim(),
    department: $('#f_dept').value.trim(),
    mobile: $('#f_mobile').value.trim(),
    email: $('#f_email').value.trim(),
  };
  if (!d.name || !d.company || !d.department || !d.mobile || !d.email) return show('请填写全部必填项');
  const r = await API.post('/api/referrer/register', d);
  if (!r.ok) return show(r.msg);
  $('#formArea').classList.add('hidden');
  $('#doneArea').classList.remove('hidden');
  $('#alert').className = 'alert';
};
</script>
</body>
</html>
