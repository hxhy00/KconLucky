<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>领取 KCon2026 赠票</title>
  <script>window.KCON_BASE = "{{base}}";</script>
  <link rel="stylesheet" href="{{base}}/static/css/style.css">
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:480px;">
      <div class="brand">
        <div class="t">KCon</div>
        <div class="s"><b>奕智</b> · 领取 KCon2026 赠票</div>
      </div>
      <div id="alert" class="alert"></div>
      <div id="formArea">
        <div class="field"><label>姓名<span class="req">*</span></label><input id="f_name" class="input"
            placeholder="请输入真实姓名"></div>
        <div class="field"><label>单位<span class="req">*</span></label><input id="f_company" class="input"
            placeholder="请输入单位名称"></div>
        <div class="field"><label>手机号<span class="req">*</span></label><input id="f_mobile" class="input"
            placeholder="11 位手机号，用于现场签到" maxlength="11"></div>
        <div class="field"><label>邮箱<span class="req">*</span></label><input id="f_email" class="input" type="email"
            placeholder="用于接收注册码二维码"></div>
        <button id="submitBtn" class="btn block">提交申请</button>
        <div class="hint center mt-16">提交后需推荐人确认，注册码将发送至您的邮箱</div>
      </div>
      <div id="doneArea" class="hidden center">
        <div style="font-size:52px;margin-bottom:16px;">✅</div>
        <div class="bold" style="font-size:16px;">申请已提交</div>
        <p class="muted small mt-8">请等待推荐人确认，注册码二维码将发送至您的邮箱。</p>
      </div>
    </div>
  </div>
  <script src="{{base}}/static/js/common.js"></script>
  <script>
    const REFERRER_CODE = location.pathname.split('/t/')[1] || '';
    function show(msg, type) {
      const a = $('#alert'); a.className = 'alert show ' + (type || 'err'); a.textContent = msg;
    }
    $('#submitBtn').onclick = async () => {
      const d = {
        referrer_code: REFERRER_CODE,
        name: $('#f_name').value.trim(),
        company: $('#f_company').value.trim(),
        mobile: $('#f_mobile').value.trim(),
        email: $('#f_email').value.trim(),
      };
      if (!d.name || !d.company || !d.mobile || !d.email) return show('请填写姓名、单位、手机号、邮箱');
      const r = await API.post('/api/ticket/register', d);
      if (!r.ok) return show(r.msg);
      $('#formArea').classList.add('hidden');
      $('#doneArea').classList.remove('hidden');
      $('#alert').className = 'alert';
    };
  </script>
</body>

</html>
