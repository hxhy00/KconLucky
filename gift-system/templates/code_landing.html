<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>注册码 · KCon2026</title>
  <script>window.KCON_BASE = "{{base}}";</script>
  <link rel="stylesheet" href="{{base}}/static/css/style.css">
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:460px;">
      <div class="brand">
        <div class="t">KCon</div>
        <div class="s"><b>奕智</b> · 注册码查询</div>
      </div>
      <div id="content">
        <div class="empty">查询中…</div>
      </div>
      <div class="center mt-24 small dim">
        本页面仅展示注册码状态，不展示个人信息
      </div>
    </div>
  </div>
  <script src="{{base}}/static/js/common.js"></script>
  <script>
    const CODE = location.pathname.split('/c/')[1] || '';
    (async () => {
      const r = await API.post('/api/code/info', { code: CODE });
      if (!r.ok) {
        $('#content').innerHTML = `<div class="center">
      <div style="font-size:52px;margin-bottom:16px;">⚠️</div>
      <div class="bold">${r.msg}</div>
      <p class="muted small mt-8">请核对二维码是否正确</p></div>`;
        return;
      }
      const d = r.data;
      $('#content').innerHTML = d.checked_in
        ? `<div class="center">
        <div style="font-size:52px;margin-bottom:16px;">✅</div>
        <div class="bold" style="font-size:17px;color:#22c55e;">已完成签到</div>
        <p class="muted small mt-8">签到时间：${d.checked_at || '--'}</p>
        <p class="dim small mt-16">如需帮助请联系签到台工作人员</p>
      </div>`
        : `<div class="center">
        <div style="font-size:52px;margin-bottom:16px;">🎫</div>
        <div class="bold" style="font-size:17px;color:#00e5ff;">注册码有效</div>
        <p class="muted small mt-8">现场签到由 KconLucky 系统完成，请向签到台工作人员出示此注册码</p>
        <div class="linkbox mt-16" style="justify-content:center;">
          <span class="mono">${CODE}</span>
        </div>
      </div>`;
    })();
  </script>
</body>

</html>
