# =============================================================
# 镜像构建：backend（Spring Boot）/ web（三端静态 + nginx）
# -------------------------------------------------------------
# 产物推 GitHub Container Registry（GHCR），tag 约定：
#   latest                 跟最新（仅 push 到 main 时打）
#   sha-<git 短 SHA>       可精确回滚（每次构建都打）
# 与 docs/04-部署运行.md §8.5 的内网 Harbor（rc / rc-<sha>）语义对应但地址不同；
# 服务器侧把 docker-compose.yml 的 image 换成 ghcr.io 地址（或 digest）即可
# docker compose pull && up -d --no-build，不再需要 docker save | ssh | docker load。
#
# 目标平台固定 linux/amd64：服务器是 x86_64，ARM 产物在服务器上起不来
# （本地 Apple Silicon 构建时必须显式 --platform，这里是同一约束的 CI 版本）。
# =============================================================
name: docker-build

on:
  push:
    branches: [main]
    # rc：发布候选 tag，打 tag 即产出可部署镜像（sha-<短SHA>）
    tags: ['v*', 'rc']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/PR 只保留最新一次构建，避免连续推送时镜像互相覆盖
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    # 防挂起构建长期占用 runner（默认 360 分钟）
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 镜像名 kconlucky-backend / kconlucky-web 沿用部署文档的命名，
          # 但 GHCR 要求仓库名全小写，故固定写死而不派生于仓库名
          - name: backend
            dockerfile: docker/backend/Dockerfile
            image: kconlucky-backend
          - name: web
            dockerfile: docker/web/Dockerfile
            image: kconlucky-web
    steps:
      - uses: actions/checkout@v4

      # buildx 必装：backend 的 Dockerfile 用到 --from 多阶段（原生 docker build 也支持，
      # 但 buildx 才稳定支持 --platform 与 GHA 缓存导出）
      - uses: docker/setup-buildx-action@v3

      # PR 只验证构建能否通过，不登录也不推送（fork 来的 PR 拿不到 packages:write）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}"
          # GHCR 镜像名必须小写；repository 若含大写（GitHub 用户名/仓库名大小写混用）会推送失败
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # latest 只在「push 到 main」时打：tag 构建（可能用旧提交打 v*）与
          # 手动触发（可能从任意分支）都会把 latest 回退，服务器 pull latest 变旧版
          TAGS="${IMAGE}:sha-$(git rev-parse --short HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # 只有 push 到 main 才推送：PR 只验证构建；手动触发（workflow_dispatch）
          # 可能从任意分支发起，推了会用非 main 代码覆盖 latest
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          # 复用上一轮层缓存：三端前端 npm ci 与 maven 依赖下载是最慢的两步
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
