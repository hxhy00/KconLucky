# =============================================================
# 镜像构建：backend（Spring Boot）/ web（三端静态 + nginx）/ mysql（基线 SQL）
# -------------------------------------------------------------
# 产物推 GitHub Container Registry（GHCR），tag 采用 OSS 常见约定：
#   sha-<短SHA>            每次构建都有，不可变，生产按这个锁版本/回滚
#   edge                   main 分支最新构建（等价 nightly/dev 通道）
#   <git tag>              打什么 tag 就产出什么镜像 tag（如 v1.2.3、v1.2.3-rc.1）
#   1.2.3 / 1.2 / 1        仅语义化正式版（v1.2.3）产出，版本别名
#   latest                 仅语义化正式版产出；预发布与 main 推送都不会动它
# 与 docs/04-部署运行.md §8.5 的内网 Harbor 流程并存，地址与命名各成一套；
# 服务器侧把 docker-compose.yml 的 image 换成 ghcr.io 地址（或 digest）即可
# docker compose pull && up -d --no-build，不再需要 docker save | ssh | docker load。
#
# 目标平台：linux/amd64 + linux/arm64（AMD64/ARM64 机器都能直接跑）。
# 多架构走 QEMU 模拟构建，ARM 侧编译比原生慢，但产物与真机 ABI 一致；
# 本地 Apple Silicon / ARM 服务器无需再手动 --platform。
# =============================================================
name: docker-build

on:
  push:
    branches: [main]
    # rc：发布候选 tag，打 tag 即产出可部署镜像（sha-<短SHA>）
    tags: ['v*', 'rc']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/PR 只保留最新一次构建，避免连续推送时镜像互相覆盖
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    # 防挂起构建长期占用 runner（默认 360 分钟）。
    # 双架构冷缓存实测：backend ≈14.5m、web ≈12m；两条流水线并行（如同时 push
    # main 与打 tag）会争抢同一份 GHA 缓存，实测可翻倍到 30m+，故留到 60m。
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 镜像名 kconlucky-backend / kconlucky-web 沿用部署文档的命名，
          # 但 GHCR 要求仓库名全小写，故固定写死而不派生于仓库名
          - name: backend
            dockerfile: docker/backend/Dockerfile
            image: kconlucky-backend
          - name: web
            dockerfile: docker/web/Dockerfile
            image: kconlucky-web
          # mysql 镜像把 sql/ 基线脚本打进 /docker-entrypoint-initdb.d，
          # 让外部用户只靠镜像 + 编排文件就能起库（见 docker-compose.release.yml）
          - name: mysql
            dockerfile: docker/mysql/Dockerfile
            image: kconlucky-mysql
    steps:
      - uses: actions/checkout@v4

      # buildx 必装：backend 的 Dockerfile 用到 --from 多阶段（原生 docker build 也支持，
      # 但 buildx 才稳定支持 --platform 与 GHA 缓存导出）
      - uses: docker/setup-buildx-action@v3

      # QEMU 必装：runner 是 amd64，构建 arm64 层靠它做指令集模拟
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # PR 只验证构建能否通过，不登录也不推送（fork 来的 PR 拿不到 packages:write）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}"
          # GHCR 镜像名必须小写；repository 若含大写（GitHub 用户名/仓库名大小写混用）会推送失败
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          SHA=$(git rev-parse --short HEAD)
          # 每次构建必有不可变 tag，用于精确回滚
          TAGS="${IMAGE}:sha-${SHA}"

          # 分支构建：main → edge。latest 只给正式版本（OSS 惯例），
          # 否则「打到旧提交的 tag」会把 latest 往回带，pull latest 的机器变旧版
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:edge"
          fi

          # git tag 构建：tag 名直接做镜像 tag（v1.2.3-rc.1 → :v1.2.3-rc.1）。
          # 语义化正式版再加 1.2.3 / 1.2 / 1 别名与 latest（对齐 nginx/postgres 习惯）；
          # 预发布（带 -rc/-beta 后缀）只产自身，never 覆盖 latest。
          case "${GITHUB_REF}" in
            refs/tags/*)
              TAG_NAME=$(echo "${GITHUB_REF#refs/tags/}" | tr '[:upper:]' '[:lower:]')
              TAGS="${TAGS}
          ${IMAGE}:${TAG_NAME}"
              if echo "${TAG_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                VER="${TAG_NAME#v}"
                MAJOR="${VER%%.*}"
                MINOR="${VER#*.}"
                MINOR="${MINOR%%.*}"
                TAGS="${TAGS}
          ${IMAGE}:${VER}
          ${IMAGE}:${MAJOR}.${MINOR}
          ${IMAGE}:${MAJOR}
          ${IMAGE}:latest"
              fi
              ;;
          esac
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 双架构单 manifest：x86 服务器与 Apple Silicon / ARM 云主机都能直接 pull
          platforms: linux/amd64,linux/arm64
          # 只有 push 到 main 才推送：PR 只验证构建；手动触发（workflow_dispatch）
          # 可能从任意分支发起，推了会用非 main 代码覆盖 latest
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          # 复用上一轮层缓存：三端前端 npm ci 与 maven 依赖下载是最慢的两步。
          # 只有 push 到 main 才「写」缓存：打 tag / 手动触发若同时写同一 scope，
          # 两条流水线会互相覆盖缓存条目（实测并行时构建时间翻倍），这里让它们只读。
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
