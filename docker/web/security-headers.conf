# 统一安全响应头。
# 注意：nginx 的 add_header 在 location 内声明过任何 add_header 时会整体失效
# （继承按「层」走，location 自带一条就不再继承上层），所以本文件只放公共三条，
# 各 location 里已单独写了 Cache-Control 的地方需要把这三条一并写上（见 nginx.conf）。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
