user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 公共安全响应头。注意：带 add_header 的 location 不会继承这里的头，
    # 那些 location 已逐条补齐（见下方各处注释与 security-headers.conf）
    include /etc/nginx/security-headers.conf;

    # 外层反向代理（如 company.com 入口、SLB）转发过来的真实客户端 IP。
    # 信任网段由 entrypoint 按 NGINX_TRUSTED_CIDRS 生成到 /etc/nginx/trusted-cidrs.conf
    # （默认只信回环 + Docker 网桥：外层反代经 docker-proxy 进来的源 IP 是网关地址）。
    # 刻意不信任 192.168/16 与更宽的段：现场观众本身就处于 192.168.x，
    # 信任它等于允许任何观众自带 X-Forwarded-For 伪造 IP 绕过按 IP 的限流。
    # 解析后 $remote_addr 即真实客户端 IP，下面各 location 的
    # proxy_set_header X-Real-IP 才是逐个观众的真实地址。
    include /etc/nginx/trusted-cidrs.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    upstream kcon_backend {
        server backend:8080;
        keepalive 32;
    }

    # 外层 TLS 终止时传来的协议：有值透传，无值（直连 HTTP）用本机 scheme。
    # 不能直接写 proxy_set_header X-Forwarded-Proto $scheme：内层收到的永远是
    # http，会把外层的 https 覆盖掉，后端 forward-headers-strategy 还原不出
    # https，CORS 同源判定失败 → 登录等 POST 接口全部 403 "Invalid CORS request"
    #
    # 少数 WAF / 老反代只发 X-Forwarded-Ssl: on，不发 X-Forwarded-Proto
    #（现场遇到的是创宇盾：浏览器侧是 https，后端却只看到 http，POST 全 403）。
    # 这里做第二来源：XFP 为空时才看 X-Forwarded-Ssl，两者都有时以 XFP 为准。
    map $http_x_forwarded_ssl $forwarded_proto_ssl {
        "on"    https;
        default $scheme;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $forwarded_proto_ssl;
        default $http_x_forwarded_proto;
    }

    server {
        listen       80;
        server_name  _;
        charset utf-8;

        # =============================================================
        # 统一对外前缀：/kconluck2026/
        # 三端（管理端 / 签到 H5 / 抽奖大屏）全部挂在这一个前缀下，
        # 便于整体反代到 knownsec.com/kconluck2026/。
        # 前缀由各前端构建参数（VUE_APP_BASE_PATH、VITE_BASE）决定，
        # 改前缀时必须同时改前端配置并重建 web 镜像。
        # =============================================================

        # 根路径一律跳到统一前缀，避免两套地址并存
        location = / {
            return 301 /kconluck2026/;
        }
        location = /kconluck2026 {
            return 301 /kconluck2026/;
        }

        # ---------- 入口分流页 ----------
        # 用 alias 指向目录 + index，内部重定向到 /kconluck2026/index.html。
        # 注意：location 以 / 结尾时 alias 不能直接指向文件，nginx 会拼成
        # "index.htmlindex.html" 并报 500（已踩过）。
        location = /kconluck2026/ {
            alias /usr/share/nginx/html/;
            index index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # index 指令与 try_files 都会对 index.html 发起内部跳转，
        # 必须为它单独声明 location，否则会被下面的前缀兜底拦成 404
        location = /kconluck2026/index.html {
            alias /usr/share/nginx/html/index.html;
            # 本 location 自带 add_header，http 层的安全头不会继承，须重复声明
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 分流页的品牌图与 favicon（页面内用相对路径引用）
        location = /kconluck2026/kcon-mark.png {
            alias /usr/share/nginx/html/kcon-mark.png;
        }
        location = /kconluck2026/favicon.ico {
            alias /usr/share/nginx/html/favicon.ico;
        }

        # ---------- 管理端（RuoYi-Vue + webpack，产物在 /admin/static/） ----------
        location = /kconluck2026/admin {
            return 301 /kconluck2026/admin/;
        }

        location ^~ /kconluck2026/admin/static/ {
            alias /usr/share/nginx/html/admin/static/;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /kconluck2026/admin/index.html {
            alias /usr/share/nginx/html/admin/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /kconluck2026/admin/ {
            alias      /usr/share/nginx/html/admin/;
            index      index.html;
            try_files $uri $uri/ /kconluck2026/admin/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 签到 H5（观众入口） ----------
        location = /kconluck2026/sign {
            return 301 /kconluck2026/sign/;
        }

        # 构建产物（文件名带 hash）可长缓存。
        # 这类 ^~ 规则必须挡在 SPA 兜底之前：文件缺失时要返回 404，
        # 绝不能落到 try_files 返回 index.html —— 浏览器会把 HTML 当 JS 执行，
        # 报 "Unexpected token '<'"，整个应用起不来，现象是「页面能开但内容空白」。
        location ^~ /kconluck2026/sign/assets/ {
            alias /usr/share/nginx/html/checkin/assets/;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # 换版 404 防护不靠 nginx：entrypoint 发布新版时按"合并"方式写入
        # （hash 文件名不冲突，旧 chunk 自然留存一代），见 docker/web/entrypoint.sh
        location = /kconluck2026/sign/index.html {
            alias /usr/share/nginx/html/checkin/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ^~ /kconluck2026/sign/ {
            alias  /usr/share/nginx/html/checkin/;
            index  index.html;
            try_files $uri $uri/ /kconluck2026/sign/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 抽奖大屏 ----------
        location = /kconluck2026/screen {
            return 301 /kconluck2026/screen/;
        }

        location ^~ /kconluck2026/screen/assets/ {
            alias /usr/share/nginx/html/screen/assets/;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /kconluck2026/screen/index.html {
            alias /usr/share/nginx/html/screen/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /kconluck2026/screen/ {
            alias      /usr/share/nginx/html/screen/;
            index      index.html;
            try_files $uri $uri/ /kconluck2026/screen/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 后端 API ----------
        location /kconluck2026/prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # XFF 用 real_ip 解析后的真实客户端 IP：审计日志（IpUtils 取首段）
            # 不再采信客户端自带值，伪造不了
            proxy_set_header X-Forwarded-For $remote_addr;
            # 协议透传外层的 https（map 见 http 块）；Host/Port 一并覆盖，
            # 防止客户端伪造 X-Forwarded-Host/Port 骗过同源判定。
            # Host 必须用 $http_host（带端口）：$host 会丢端口，非 80 直连时
            # 后端还原出的端口与浏览器 Origin（http://ip:8081）不匹配 → 全 403
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_backend/;
            proxy_read_timeout 300s;
        }

        # ---------- 未命中任何前缀：一律 404 ----------
        location = /admin {
            return 301 /kconluck2026/admin/;
        }
        location = /admin/ {
            return 301 /kconluck2026/admin/;
        }
        location = /sign {
            return 301 /kconluck2026/sign/$is_args$args;
        }
        location = /sign/ {
            return 301 /kconluck2026/sign/$is_args$args;
        }
        location = /screen {
            return 301 /kconluck2026/screen/;
        }
        location = /screen/ {
            return 301 /kconluck2026/screen/;
        }

        # ---------- 旧根路径后端 API（保留兼容：脚本、旧页面） ----------
        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # XFF 用 real_ip 解析后的真实客户端 IP：审计日志（IpUtils 取首段）
            # 不再采信客户端自带值，伪造不了
            proxy_set_header X-Forwarded-For $remote_addr;
            # 协议透传外层的 https（map 见 http 块）；Host/Port 一并覆盖，
            # 防止客户端伪造 X-Forwarded-Host/Port 骗过同源判定。
            # Host 必须用 $http_host（带端口）：$host 会丢端口，非 80 直连时
            # 后端还原出的端口与浏览器 Origin（http://ip:8081）不匹配 → 全 403
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_backend/;
            proxy_read_timeout 300s;
        }

        # ---------- 未命中任何前缀：一律 404 ----------
        # nginx 镜像里没有 /etc/nginx/html，落到默认 location 会变成 nginx 硬 404 页，
        # 现场人员无法判断原因，这里显式兜底
        location / {
            return 404;
        }
    }
}
