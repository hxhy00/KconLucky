user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 公共安全响应头。注意：带 add_header 的 location 不会继承这里的头，
    # 那些 location 已逐条补齐（见下方各处注释与 security-headers.conf）
    include /etc/nginx/security-headers.conf;

    upstream kcon_backend {
        server backend:8080;
        keepalive 32;
    }

    # 赠票系统（Python + SQLite），只在内网暴露 8848
    upstream kcon_gift {
        server gift:8848;
        keepalive 8;
    }

    server {
        listen       80;
        server_name  _;
        charset utf-8;

        # =============================================================
        # 统一对外前缀：/kconluck2026/
        # 四端（管理端 / 签到 H5 / 抽奖大屏 / 赠票系统）全部挂在这一个
        # 前缀下，便于整体反代到 knownsec.com/kconluck2026/。
        # 前缀由各前端构建参数（VUE_APP_BASE_PATH、VITE_BASE）决定，
        # 改前缀时必须同时改前端配置并重建 web 镜像。
        # =============================================================

        # 根路径一律跳到统一前缀，避免两套地址并存
        location = / {
            return 301 /kconluck2026/;
        }
        location = /kconluck2026 {
            return 301 /kconluck2026/;
        }

        # ---------- 入口分流页 ----------
        # 用 alias 指向目录 + index，内部重定向到 /kconluck2026/index.html。
        # 注意：location 以 / 结尾时 alias 不能直接指向文件，nginx 会拼成
        # "index.htmlindex.html" 并报 500（已踩过）。
        location = /kconluck2026/ {
            alias /usr/share/nginx/html/;
            index index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # index 指令与 try_files 都会对 index.html 发起内部跳转，
        # 必须为它单独声明 location，否则会被下面的前缀兜底拦成 404
        location = /kconluck2026/index.html {
            alias /usr/share/nginx/html/index.html;
            # 本 location 自带 add_header，http 层的安全头不会继承，须重复声明
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 分流页的品牌图与 favicon（页面内用相对路径引用）
        location = /kconluck2026/kcon-mark.png {
            alias /usr/share/nginx/html/kcon-mark.png;
        }
        location = /kconluck2026/favicon.ico {
            alias /usr/share/nginx/html/favicon.ico;
        }

        # ---------- 管理端（RuoYi-Vue + webpack，产物在 /admin/static/） ----------
        location = /kconluck2026/admin {
            return 301 /kconluck2026/admin/;
        }

        location ^~ /kconluck2026/admin/static/ {
            alias /usr/share/nginx/html/admin/static/;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /kconluck2026/admin/index.html {
            alias /usr/share/nginx/html/admin/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /kconluck2026/admin/ {
            alias      /usr/share/nginx/html/admin/;
            index      index.html;
            try_files $uri $uri/ /kconluck2026/admin/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 签到 H5（观众入口） ----------
        location = /kconluck2026/sign {
            return 301 /kconluck2026/sign/;
        }

        # 构建产物（文件名带 hash）可长缓存。
        # 这类 ^~ 规则必须挡在 SPA 兜底之前：文件缺失时要返回 404，
        # 绝不能落到 try_files 返回 index.html —— 浏览器会把 HTML 当 JS 执行，
        # 报 "Unexpected token '<'"，整个应用起不来，现象是「页面能开但内容空白」。
        location ^~ /kconluck2026/sign/assets/ {
            alias /usr/share/nginx/html/checkin/assets/;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # 换版 404 防护不靠 nginx：entrypoint 发布新版时按"合并"方式写入
        # （hash 文件名不冲突，旧 chunk 自然留存一代），见 docker/web/entrypoint.sh
        location = /kconluck2026/sign/index.html {
            alias /usr/share/nginx/html/checkin/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ^~ /kconluck2026/sign/ {
            alias  /usr/share/nginx/html/checkin/;
            index  index.html;
            try_files $uri $uri/ /kconluck2026/sign/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 抽奖大屏 ----------
        location = /kconluck2026/screen {
            return 301 /kconluck2026/screen/;
        }

        location ^~ /kconluck2026/screen/assets/ {
            alias /usr/share/nginx/html/screen/assets/;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /kconluck2026/screen/index.html {
            alias /usr/share/nginx/html/screen/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /kconluck2026/screen/ {
            alias      /usr/share/nginx/html/screen/;
            index      index.html;
            try_files $uri $uri/ /kconluck2026/screen/index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 后端 API ----------
        location /kconluck2026/prod-api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_backend/;
            proxy_read_timeout 300s;
        }

        # ---------- 赠票系统（其余 /kconluck2026/ 路径） ----------
        # 前缀透传给赠票系统，由它按 KCON_BASE_PATH 自行剥离；
        # 前缀必须与容器环境变量 KCON_BASE_PATH 一致。
        # 该 ^~ 兜底排在所有更长前缀（admin/sign/screen/prod-api）之后生效。
        location ^~ /kconluck2026/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }

        # =============================================================
        # 旧路径兼容：迁移到统一前缀前的地址一律 301
        # 只兜页面入口；旧静态资源路径不再兼容（换版后旧缓存页刷新即恢复）
        # =============================================================
        location = /admin {
            return 301 /kconluck2026/admin/;
        }
        location = /admin/ {
            return 301 /kconluck2026/admin/;
        }
        location = /sign {
            return 301 /kconluck2026/sign/$is_args$args;
        }
        location = /sign/ {
            return 301 /kconluck2026/sign/$is_args$args;
        }
        location = /screen {
            return 301 /kconluck2026/screen/;
        }
        location = /screen/ {
            return 301 /kconluck2026/screen/;
        }

        # =============================================================
        # 赠票系统根路径（保留：本机排障、回滚、旧邮件链接）
        # 管理端/审批员页用 /gift-* 前缀，避免与 KconLucky 的 /admin/ 冲突
        # =============================================================
        location = /gift-admin {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location = /gift-approver {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location = /mailbox {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location = /login {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location /static/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location /r/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location /t/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location /c/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }
        location /approve/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_gift;
            proxy_read_timeout 30s;
        }

        # ---------- 旧根路径后端 API（保留兼容：脚本、旧页面） ----------
        location /prod-api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_backend/;
            proxy_read_timeout 300s;
        }

        # ---------- 未命中任何前缀：一律 404 ----------
        # nginx 镜像里没有 /etc/nginx/html，落到默认 location 会变成 nginx 硬 404 页，
        # 现场人员无法判断原因，这里显式兜底
        location / {
            return 404;
        }
    }
}
