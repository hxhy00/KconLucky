user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    upstream kcon_backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;
        charset utf-8;

        # ---------- 根路径：入口分流页（管理端 / 大屏 / 签到） ----------
        location = / {
            root  /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # index 指令与 try_files 都会对 /index.html 发起内部跳转，
        # 必须为它单独声明 location，否则会被下面的 location / 兜底拦成 404
        location = /index.html {
            root /usr/share/nginx/html;
            # 入口 HTML 一律不缓存：每次构建 chunk 文件名都会变，
            # 缓存住旧 HTML 就会去请求已被删除的资源，表现为刷新后白屏
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 入口分流页的品牌图（由分流页 HTML 引用）
        location = /kcon-mark.png {
            root /usr/share/nginx/html;
        }

        # 根路径 favicon：不加这条的话浏览器默认请求 /favicon.ico 会落到 location / 变 404
        location = /favicon.ico {
            root /usr/share/nginx/html;
        }

        # ---------- 签到 H5（观众入口，/sign/） ----------
        # 必须用 = /sign + ^~ /sign/ 两段式：单一 location /sign 是前缀匹配，
        # 会把 /signup、/signin 等同前缀路径也吞进来并静默返回签到页
        location = /sign {
            return 301 /sign/;
        }

        # 构建产物（文件名带 hash）可长缓存。
        # 这类 ^~ 规则必须挡在 SPA 兜底之前：文件缺失时要返回 404，
        # 绝不能落到 try_files 返回 index.html —— 浏览器会把 HTML 当 JS 执行，
        # 报 "Unexpected token '<'"，整个应用起不来，现象是「页面能开但内容空白」。
        # 注意：alias 下不要写 try_files $uri，nginx 会按 root 而非 alias 解析导致路径错。
        location ^~ /sign/assets/ {
            alias /usr/share/nginx/html/checkin/assets/;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /sign/index.html {
            alias /usr/share/nginx/html/checkin/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ^~ /sign/ {
            alias  /usr/share/nginx/html/checkin/;
            index  index.html;
            try_files $uri $uri/ /sign/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 管理端（RuoYi-Vue + webpack，产物在 /admin/static/） ----------
        location = /admin {
            return 301 /admin/;
        }

        location ^~ /admin/static/ {
            alias /usr/share/nginx/html/admin/static/;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /admin/index.html {
            alias /usr/share/nginx/html/admin/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /admin/ {
            alias      /usr/share/nginx/html/admin/;
            index      index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 抽奖大屏 ----------
        location = /screen {
            return 301 /screen/;
        }

        location ^~ /screen/assets/ {
            alias /usr/share/nginx/html/screen/assets/;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location = /screen/index.html {
            alias /usr/share/nginx/html/screen/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /screen/ {
            alias      /usr/share/nginx/html/screen/;
            index      index.html;
            try_files $uri $uri/ /screen/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------- 未命中任何前缀：一律 404 ----------
        # nginx 镜像里没有 /etc/nginx/html，落到默认 location 会变成 nginx 硬 404 页，
        # 现场人员无法判断原因，这里显式兜底
        location / {
            return 404;
        }

        # ---------- 后端 API ----------
        location /prod-api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_backend/;
            proxy_read_timeout 300s;
        }
    }
}
