user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    upstream kcon_backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;
        charset utf-8;

        # ---------- 根路径：入口分流页（管理端 / 大屏 / 签到） ----------
        location = / {
            root  /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # index 指令与 try_files 都会对 /index.html 发起内部跳转，
        # 必须为它单独声明 location，否则会被下面的 location / 兜底拦成 404
        location = /index.html {
            root /usr/share/nginx/html;
        }

        # 入口分流页的品牌图（由分流页 HTML 引用）
        location = /kcon-logo.png {
            root /usr/share/nginx/html;
        }

        # ---------- 签到 H5（观众入口，/sign/） ----------
        # 必须用 = /sign + ^~ /sign/ 两段式：单一 location /sign 是前缀匹配，
        # 会把 /signup、/signin 等同前缀路径也吞进来并静默返回签到页
        location = /sign {
            return 301 /sign/;
        }

        location ^~ /sign/ {
            alias  /usr/share/nginx/html/checkin/;
            index  index.html;
            try_files $uri $uri/ /sign/index.html;
        }

        # ---------- 管理端（RuoYi-Vue） ----------
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            alias      /usr/share/nginx/html/admin/;
            index      index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # ---------- 抽奖大屏 ----------
        location = /screen {
            return 301 /screen/;
        }

        location /screen/ {
            alias      /usr/share/nginx/html/screen/;
            index      index.html;
            try_files $uri $uri/ /screen/index.html;
        }

        # ---------- 未命中任何前缀：一律 404 ----------
        # nginx 镜像里没有 /etc/nginx/html，落到默认 location 会变成 nginx 硬 404 页，
        # 现场人员无法判断原因，这里显式兜底
        location / {
            return 404;
        }

        # ---------- 后端 API ----------
        location /prod-api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://kcon_backend/;
            proxy_read_timeout 300s;
        }
    }
}
