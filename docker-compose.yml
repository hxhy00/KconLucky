# =============================================================
# KCon 2026 签到 + 抽奖系统 · 一键启动
# 用法：docker compose up -d --build
# 访问：http://<LAN_IP>/           入口分流页（管理端 / 大屏 / 签到）
#       http://<LAN_IP>/admin/     管理端（首次登录后请立即修改初始口令）
#       http://<LAN_IP>/screen/    抽奖大屏
#       http://<LAN_IP>/sign/      观众签到（二维码指向此地址）
# =============================================================

services:

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: kcon-mysql
    restart: unless-stopped
    environment:
      # 不设默认口令：兜底默认值等于把弱口令固化进仓库。未在 .env 中配置时
      # compose 会直接报错退出，避免带着 root123 上线
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kcon_lucky}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=300
      - --max-allowed-packet=64M
      - --skip-log-bin
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/kcon.cnf:ro
      # 首次启动自动建表 + 初始化数据（容器内按文件名顺序执行）
      - ./sql/00-ry-base.sql:/docker-entrypoint-initdb.d/00-ry-base.sql:ro
      - ./sql/kcon_lucky.sql:/docker-entrypoint-initdb.d/01-kcon_lucky.sql:ro
      - ./sql/kcon_menu.sql:/docker-entrypoint-initdb.d/02-kcon-menu.sql:ro
      # 增量迁移脚本（幂等，已存在的列/索引/角色会跳过）。
      # 基线建表脚本现已包含这些对象，但对「已存在但缺列」的库仍是必需的；
      # 漏挂会导致库缺 kcon_winner.email 等对象，中奖查询直接 Unknown column。
      #
      # 挂载顺序即执行顺序，必须按版本号排列。漏挂 v3~v8 会造成：
      #   v7 漏 → 缺 kcon_attendee.ticket_type_manual，人工改的权益被导入覆盖
      #   v8 漏 → 缺 kcon_staff 角色与 staff 账号，现场工作人员无可用登录账号
      - ./sql/kcon_migrate_v2.sql:/docker-entrypoint-initdb.d/03-kcon-migrate_v2.sql:ro
      - ./sql/kcon_migrate_v3.sql:/docker-entrypoint-initdb.d/04-kcon-migrate_v3.sql:ro
      - ./sql/kcon_migrate_v4.sql:/docker-entrypoint-initdb.d/05-kcon-migrate_v4.sql:ro
      - ./sql/kcon_migrate_v5.sql:/docker-entrypoint-initdb.d/06-kcon-migrate_v5.sql:ro
      - ./sql/kcon_migrate_v6.sql:/docker-entrypoint-initdb.d/07-kcon-migrate_v6.sql:ro
      - ./sql/kcon_migrate_v7.sql:/docker-entrypoint-initdb.d/08-kcon-migrate_v7.sql:ro
      - ./sql/kcon_migrate_v8.sql:/docker-entrypoint-initdb.d/09-kcon-migrate_v8.sql:ro
      # v9 隐藏原生「系统管理」，并在「设置」下新建用户管理页（创建工作人员账号用）
      - ./sql/kcon_migrate_v9.sql:/docker-entrypoint-initdb.d/10-kcon_migrate_v9.sql:ro
    ports:
      # 仅绑定本机回环，不对局域网暴露；现场若不需要本机调试可整段注释掉
      - "127.0.0.1:${MYSQL_DEBUG_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:?}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [kcon]

  # ---------- Redis（RuoYi 登录 token / 缓存） ----------
  redis:
    image: redis:7-alpine
    container_name: kcon-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kcon]

  # ---------- 后端 SpringBoot ----------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: kcon/backend:1.0
    container_name: kcon-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BACKEND_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError}
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kcon_lucky}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_PASSWORD: ""
      LAN_IP: ${LAN_IP:-127.0.0.1}
      # JWT 签名密钥（必填，无默认值）。强度由 TokenService 启动时校验，不达标拒绝启动
      TOKEN_SECRET: ${TOKEN_SECRET:?必须在 .env 中配置 TOKEN_SECRET，生成方式：openssl rand -base64 48}
    volumes:
      - ./data/upload:/app/uploadPath
      - ./data/backup:/app/backup
      - ./logs/backend:/app/logs
    networks: [kcon]

  # ---------- Web 统一入口（三端静态 + 反代） ----------
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: kcon/web:1.0
    container_name: kcon-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 静态资源持久化到宿主机卷：换版时 entrypoint 把上一版挪进 prev/ 保留，
      # 已打开设备（缓存旧 index.html）刷新请求旧 hash chunk 由 nginx 回退
      # prev/ 提供，不再 404 白屏（第三轮测试报告问题 5）
      - ./data/web-static:/usr/share/nginx/html
    networks: [kcon]

networks:
  kcon:
    driver: bridge
