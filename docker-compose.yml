# =============================================================
# KCon 2026 签到 + 抽奖系统 · 一键启动
# 用法：docker compose up -d --build
# 访问：http://<LAN_IP>/           入口分流页（管理端 / 大屏 / 签到）
#       http://<LAN_IP>/admin/     管理端（首次登录后请立即修改初始口令）
#       http://<LAN_IP>/screen/    抽奖大屏
#       http://<LAN_IP>/sign/      观众签到（二维码指向此地址）
# =============================================================

services:

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: kcon-mysql
    restart: unless-stopped
    environment:
      # 不设默认口令：兜底默认值等于把弱口令固化进仓库。未在 .env 中配置时
      # compose 会直接报错退出，避免带着 root123 上线
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kcon_lucky}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=100
      - --max-allowed-packet=64M
      - --skip-log-bin
    # 内存上限需与 my.cnf 保持一致（docker/mysql/my.cnf），改两处一起改
    mem_limit: 600m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/kcon.cnf:ro
      # 首次启动自动建库建表（容器内按文件名顺序执行）。
      # 只挂基线三脚本：00 建 RuoYi 基础表 → 01 建 KCon 业务表 → 02 建菜单/角色/权限/账号。
      # 增量迁移脚本已废弃（2026-10-23）：所有结构/菜单/授权已吸收进基线，
      # 已部署库升级 = 删 data/mysql 后重建（无生产数据时）或走数据迁移恢复。
      - ./sql/00-ry-base.sql:/docker-entrypoint-initdb.d/00-ry-base.sql:ro
      - ./sql/kcon_lucky.sql:/docker-entrypoint-initdb.d/01-kcon_lucky.sql:ro
      - ./sql/kcon_menu.sql:/docker-entrypoint-initdb.d/02-kcon-menu.sql:ro
    ports:
      # 仅绑定本机回环，不对局域网暴露；现场若不需要本机调试可整段注释掉
      - "127.0.0.1:${MYSQL_DEBUG_PORT:-3307}:3306"
    healthcheck:
      # 用容器内环境变量取口令，避免明文出现在 ps/日志里；$$ 让 compose 不做插值
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [kcon]

  # ---------- Redis（RuoYi 登录 token / 缓存） ----------
  redis:
    image: redis:7-alpine
    container_name: kcon-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kcon]

  # ---------- 后端 SpringBoot ----------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: kcon/backend:1.0
    container_name: kcon-backend
    restart: unless-stopped
    # JVM 堆 512m + 元空间 192m + 线程栈/直接内存，850m 留有余量
    mem_limit: 850m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BACKEND_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError}
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kcon_lucky}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_PASSWORD: ""
      LAN_IP: ${LAN_IP:-127.0.0.1}
      # JWT 签名密钥（必填，无默认值）。强度由 TokenService 启动时校验，不达标拒绝启动
      TOKEN_SECRET: ${TOKEN_SECRET:?必须在 .env 中配置 TOKEN_SECRET，生成方式：openssl rand -base64 48}
    volumes:
      - ./data/upload:/app/uploadPath
      - ./data/backup:/app/backup
      - ./logs/backend:/app/logs
    networks: [kcon]

  # ---------- 赠票系统（渠道 → 推荐人 → 接收人；不承担现场签到） ----------
  gift:
    image: kcon/gift:1.0
    container_name: kcon-gift
    restart: unless-stopped
    # Python + Pillow 常驻约 50-70m，128m 留余量
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 对外地址（默认走 80 反代）；链接与页面跳转以此为准
      KCON_SITE_URL: ${GIFT_SITE_URL:-http://123.57.9.62}
      # 子路径部署前缀（如挂到 knownsec.com/kconluck2026/）；留空表示根路径
      KCON_BASE_PATH: ${KCON_BASE_PATH:-}
      KCON_DB_PATH: /app/data/kcon.db
      # 初始管理员（admin 表为空时写入），≤3 个，email 或 email:姓名
      KCON_ADMIN_EMAILS: ${KCON_GIFT_ADMIN_EMAILS:?请在 .env 中设置 KCON_GIFT_ADMIN_EMAILS}
      KCON_SYSTEM_EMAIL: ${KCON_SYSTEM_EMAIL:-kcon@knownsec.com}
      # 生产禁止回显验证码
      KCON_DEMO_CODE: "0"
      # 二期真实发信：配置 KCON_SMTP_HOST 后自动切换 SMTP
      KCON_SMTP_HOST: ${KCON_SMTP_HOST:-}
      KCON_SMTP_PORT: ${KCON_SMTP_PORT:-465}
      KCON_SMTP_USER: ${KCON_SMTP_USER:-}
      KCON_SMTP_PASSWORD: ${KCON_SMTP_PASSWORD:-}
    volumes:
      - ./data/gift:/app/data
    networks: [kcon]

  # ---------- Web 统一入口（三端静态 + 反代） ----------
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: kcon/web:1.0
    container_name: kcon-web
    restart: unless-stopped
    # 纯 nginx 静态托管 + 反代，64m 足够
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
      - gift
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 静态资源持久化到宿主机卷：换版时 entrypoint 把上一版挪进 prev/ 保留，
      # 已打开设备（缓存旧 index.html）刷新请求旧 hash chunk 由 nginx 回退
      # prev/ 提供，不再 404 白屏（第三轮测试报告问题 5）
      - ./data/web-static:/usr/share/nginx/html
    networks: [kcon]

networks:
  kcon:
    driver: bridge
