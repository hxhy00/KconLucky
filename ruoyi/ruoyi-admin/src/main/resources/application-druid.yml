# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源（容器部署由环境变量注入，本地开发用默认值）
            master:
                url: ${SPRING_DATASOURCE_DRUID_MASTER_URL:jdbc:mysql://127.0.0.1:3307/kcon_lucky?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
                username: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:root}
                password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:root123}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # 默认关闭。控制台会完整展示 SQL（含写入的手机号明文）、数据源 URL 与会话信息，
                # 且历史默认口令是 RuoYi 公开值，经 nginx 反代后即为 /prod-api/druid/，属明确攻击面。
                # 需要排查慢 SQL 时临时改为 true，并务必用环境变量注入强口令：
                #   DRUID_USER / DRUID_PWD
                enabled: false
                # 白名单：反代场景下来源 IP 是 nginx 容器，保持空并靠 enabled 控制即可
                allow:
                url-pattern: /druid/*
                # 控制台口令（仅在 enabled=true 时生效），不设默认值
                login-username: ${DRUID_USER:}
                login-password: ${DRUID_PWD:}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        # 关闭多语句：本项目没有依赖一次执行多条 SQL 的地方，
                        # 开着会让「注入点 + 分号」有机会拼出第二条语句
                        multi-statement-allow: false